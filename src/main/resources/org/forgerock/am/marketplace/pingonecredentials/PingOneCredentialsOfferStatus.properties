nodeDescription=PingOne Credentials Offer Status
nodeHelp=The PingOne Credentials Offer Status node shows an OpenID4VCI credential offer created by the PingOne \
  Credentials Issue node as a QR code, then waits until the user's wallet has received every credential in the offer.

pingOneWorker=PingOne Worker service ID
pingOneWorker.help=The ID of the PingOne Worker service for connecting to PingOne.

pingOneUserIdAttribute=PingOne UserID Attribute
pingOneUserIdAttribute.help=Local attribute name to retrieve the PingOne userID from. Will look in journey state first, then the local datastore.

timeout=Offer Timeout
timeout.help=The period of time (in seconds) to wait for the wallet to receive the credentials. PingOne offers are \
  valid for 30 minutes. If the offer is not completed in time, the node follows the Time Out outcome.

scanQRCodeMessage=QR code message
scanQRCodeMessage.help=The message with instructions to scan the QR code to receive the credential. This is a map of locale to message.
default.scanQRCodeMessage=Scan the QR code with your wallet to receive your credential.

waitingMessage=Waiting Message
waitingMessage.help=Localization overrides for the waiting message. This is a map of locale to message.
default.waitingMessage=Waiting for your wallet to receive the credential.

successOutcome=Success
errorOutcome=Error
timeoutOutcome=Time Out
