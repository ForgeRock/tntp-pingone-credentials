nodeDescription=PingOne Credentials Issue
nodeHelp=The PingOne Credentials Issue node lets administrators issue a user credentials and register the new user credentials with the Id Registration service.

pingOneWorker=PingOne Worker service ID
pingOneWorker.help=The ID of the PingOne Worker service for connecting to PingOne.

pingOneUserIdAttribute=PingOne UserID Attribute
pingOneUserIdAttribute.help=Local attribute name to retrieve the PingOne userID from. Will look in journey state first, then the local datastore.

credentialTypeId=Credential Type Id
credentialTypeId.help=The requested credential name. This value applies to NATIVE credential issuance; \
  the OID4VCI offer path does not use it, although it remains a required setting.

credentialIssuanceMode=Credential issuance protocol
credentialIssuanceMode.help=Select NATIVE for the existing credential issuance operation or OID4VCI to create an \
  OpenID4VCI credential offer for the user. The optional OID4VCI credentials list scopes the offer to specific \
  credential types; when it is left empty the offer is created without a credentials field and PingOne provisions \
  all of the user's credential types.
credentialIssuanceMode.NATIVE=Native
credentialIssuanceMode.OID4VCI=OpenID4VCI

credentialOfferCredentials=OID4VCI credentials
credentialOfferCredentials.help=Optional credential values to include in the documented OID4VCI offer request. Leave empty to omit this field.

credentialOfferGrantTypes=OID4VCI grant types
credentialOfferGrantTypes.help=Optional grant type values to include in the documented OID4VCI offer request. Leave empty to omit this field.

attributes=Attribute map
attributes.help=Map Shared State attributes to the Credential. The KEY is the PingOne credential attribute, and the VALUE is the corresponding journey state attribute.

#outcomes
successOutcome=Success
errorOutcome=Error